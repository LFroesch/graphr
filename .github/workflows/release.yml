name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  BINARY_NAME: graphr
  BUILD_TARGET: ./cmd/graphr

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build binary (linux amd64)
        shell: bash
        run: |
          set -euo pipefail
          out="${BINARY_NAME}-linux-amd64"
          echo "Building $out"
          CGO_ENABLED=1 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o "$out" "${BUILD_TARGET}"

      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          sha256sum "${BINARY_NAME}"-* > checksums.txt

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.BINARY_NAME }}-*
            checksums.txt
          generate_release_notes: true
